name: Pocket360 - APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Pocket360/**'
      - '.github/workflows/pocket360-apk.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair Pocket360
        run: |
          mkdir -p Pocket360/projeto
          base64 --decode Pocket360/source.tar.xz.b64 | tar -xJf - -C Pocket360/projeto
          test -f Pocket360/projeto/app/src/main/java/com/pocket360/controller/MainActivity.java
      - name: Compilar APK
        run: gradle --no-daemon -p Pocket360/projeto assembleDebug
      - name: Validar APK
        run: |
          test -s Pocket360/projeto/app/build/outputs/apk/debug/app-debug.apk
          sha256sum Pocket360/projeto/app/build/outputs/apk/debug/app-debug.apk
          cp Pocket360/projeto/app/build/outputs/apk/debug/app-debug.apk Pocket360-debug.apk
      - name: Artefato para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Pocket360-APK
          path: Pocket360-debug.apk
          retention-days: 30
      - name: Publicar APK direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pocket360-auto
          name: Pocket360 - APK Android
          prerelease: true
          files: Pocket360-debug.apk
          overwrite_files: true
          body: |
            APK experimental para Android com IP e porta editáveis.
            Requer Xbox 360 RGH/JTAG com controlleremu.xex.
            Não testado em console físico; use apenas em rede local confiável.
