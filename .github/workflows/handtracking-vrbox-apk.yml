name: Hand Tracking VR Box - APK automatico
on:
  push:
    branches: [main, master]
    paths:
      - 'hand-tracking-vrbox/**'
      - '.github/workflows/handtracking-vrbox-apk.yml'
  workflow_dispatch:
concurrency:
  group: handtracking-vrbox-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript do HTML
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('hand-tracking-vrbox/app/src/main/assets/index.html','utf8');
          const js=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join('\n');
          new (require('vm').Script)(js);
          if(!html.includes('Modo VR Box'))throw Error('Modo VR Box ausente');
          console.log('JavaScript e modo VR Box verificados');
          NODE
      - name: Validar recursos do HTML enviado e do modo rapido
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const html=fs.readFileSync('hand-tracking-vrbox/app/src/main/assets/index.html','utf8');
          for(const item of [
            'function mkWin(type,dir)','function onLandmarks(L)','function gyroStep(vid)',
            'function navTo(u)','function capture()','function drawFastVR()',
            'function setFastVR(on)','function paint(W)','function drawWin(W)',
            'function initTasks()','function initLegacy()','function render(now)'
          ])assert(html.includes(item),'Recurso ausente: '+item);
          assert(html.includes('storage.googleapis.com/mediapipe-models'),'Modelo oficial ausente');
          assert(html.includes('fastStereo)drawFastVR()'),'VR rapido nao ativado');
          assert(!html.includes('expo-vision-camera-v4-mediapipe'),'URL de modelo antigo');
          console.log('Janelas, maos, direcao, navegador, galeria e VR rapido verificados');
          NODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: hand-tracking-vrbox
        run: gradle --no-daemon assembleDebug
      - name: Preparar APK
        run: |
          cp hand-tracking-vrbox/app/build/outputs/apk/debug/app-debug.apk HandTrackingVRBox.apk
          test -s HandTrackingVRBox.apk
          unzip -t HandTrackingVRBox.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose HandTrackingVRBox.apk
          ls -lh HandTrackingVRBox.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HandTrackingVRBox-APK
          path: HandTrackingVRBox.apk
      - name: Evitar publicar compilacao antiga
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Publicar APK na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: handtracking-vrbox-auto
          name: Hand Tracking VR Box - APK automatico
          body: 'Pocket Space 2.2: atualizado com o HTML (12) enviado pelo usuario. Interface com multiplas janelas, biblioteca, navegador integrado, galeria, teclado e dock. Modelo oficial de maos, pinca estabilizada, direcao optica otimizada e VR estereo rapido com composicao nativa. APK experimental: 60 FPS nao garantidos e camera ate 30 FPS. Alguns sites bloqueiam iframes.'
          files: HandTrackingVRBox.apk
          overwrite_files: true
