name: Build Hand Tracking VR APK
on:
  workflow_dispatch:
  push:
    branches: [handtracking-vr-android]
    paths:
      - 'HandTrackingVR-Android/**'
      - '.github/workflows/build-handtrackingvr.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle -p HandTrackingVR-Android assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HandTrackingVR-APK
          path: HandTrackingVR-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
