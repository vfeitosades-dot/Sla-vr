name: Gerar APK Controle Xbox 360
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/controle-xbox360-apk.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar projeto Android compativel com controlleremu.xex
        uses: actions/checkout@v4
        with:
          repository: SaveEditors/x360controller
          path: controller
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compilar APK
        working-directory: controller/android
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Controle-Xbox360-Android-APK
          path: controller/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
