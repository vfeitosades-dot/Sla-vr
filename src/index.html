function recenter(){baseY=yaw;baseP=pitch;toast('Visão centralizada')}

async function enableSensors(){if(sensors){sensors=false;toast('Movimento por toque');return}try{if(typeof DeviceOrientationEvent==='undefined')throw Error();if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error();sensors=true;sensorReady=false;toast('Aguardando sensor de orientação…');setTimeout(()=>{if(sensors&&!sensorReady){sensors=false;toast('Sensor indisponível. Use o toque para olhar.')}},2500)}catch(e){toast('Orientação indisponível neste aparelho')}}
let sensorOrigin=null;addEventListener('deviceorientation',e=>{if(!sensors||e.alpha===null||e.beta===null)return;if(!sensorReady){sensorReady=true;sensorOrigin={a:e.alpha,b:e.beta,y:yaw,p:pitch};toast('Orientação ativada')}let da=((e.alpha-sensorOrigin.a+540)%360)-180;yaw=sensorOrigin.y+da*Math.PI/180;pitch=Math.max(-1,Math.min(1,sensorOrigin.p+(e.beta-sensorOrigin.b)*Math.PI/180));lastSensor=performance.now()});
c.onpointerdown=e=>{drag={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,moved:false};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{mouse={x:e.clientX,y:e.clientY};if(drag){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>7)drag.moved=true;if(drag.moved){yaw-=(e.clientX-drag.x)*.004;pitch=Math.max(-1,Math.min(1,pitch-(e.clientY-drag.y)*.004));drag.x=e.clientX;drag.y=e.clientY}}};c.onpointerup=e=>{if(drag&&!drag.moved)at(e.clientX,e.clientY)?.fn();drag=null};c.onpointercancel=()=>drag=null;$('#mode').onclick=toggleVR;$('#center').onclick=recenter;$('#full').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>toast('Tela cheia indisponível'));addEventListener('keydown',e=>{if(e.key==='Escape')navigate('apps');if(e.key==='Enter')at(vr?W/4:W/2,H/2)?.fn();if(e.key==='ArrowLeft')yaw-=.06;if(e.key==='ArrowRight')yaw+=.06;if(e.key==='ArrowUp')pitch-=.05;if(e.key==='ArrowDown')pitch+=.05;if(e.key.toLowerCase()==='r')recenter()});
function external(url){if(window.Android?.openExternal)Android.openExternal(url);else location.href=url}navigator.getBattery?.().then(b=>{battery=b.level;b.onlevelchange=()=>battery=b.level}).catch(()=>{});document.addEventListener('visibilitychange',()=>{if(document.hidden){if(video)video.pause();stopCamera()}});toast('Seu espaço está pronto. Toque nos ícones para explorar.');
</script></html>
